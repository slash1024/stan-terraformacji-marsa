<!DOCTYPE html>
<html lang="pl" data-theme="dark" data-skin="karta"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta id="tcmeta" name="theme-color" content="#2a2724"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Stan Marsa"/>
<meta name="app-version" content="1.0.0+20261112-2212"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="apple-touch-icon" href="./apple-touch-icon.png"/>

<title>Stan Terraformacji Marsa</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;700;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Roboto+Condensed:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet"/>
<style>:root {
  --bg:      #06050a;
  --surface: #0d0b13;
  --card:    #131020;
  --border:  #28203e;
  --orange:  #f07030;
  --orange2: #c85520;
  --red:     #8b1e1e;
  --cream:   #e8d8c0;
  --muted:   #685870;
  --green:   #38985e;
  --glow:    rgba(240,112,48,0.35);
  /* warstwa skorek: typografia, ksztalt, powierzchnie */
  --font-head: 'Orbitron', sans-serif;
  --font-body: 'Exo 2', sans-serif;
  --radius:  10px;
  --bw:      1px;
  --hdr-bg:  linear-gradient(180deg,#0d0b13,transparent);
  --nav-bg:  #090713;
  --chip-bg: #1a1530;
  --row-line:#100e1c;
  --accent-soft:#2a1008;
  --accent-soft2:#1e1428;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body,#root{background:var(--bg);color:var(--cream);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}

.app{max-width:500px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
.app::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 35% at 50% 0%,rgba(61,26,10,.18),transparent),radial-gradient(ellipse 60% 30% at 80% 100%,rgba(26,10,61,.15),transparent);pointer-events:none;z-index:0}

/* HEADER */
.hdr{position:relative;z-index:10;padding:.9rem 1.25rem .8rem;border-bottom:1px solid var(--border);background:var(--hdr-bg);display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--font-head);font-size:.9rem;font-weight:900;letter-spacing:.12em;color:var(--orange);text-shadow:0 0 20px var(--glow);text-transform:uppercase;line-height:1}
.logo-sub{font-size:.58rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.hdr-badge{font-family:var(--font-head);font-size:.52rem;letter-spacing:.15em;color:var(--orange);border:1px solid var(--orange2);padding:.2rem .5rem;border-radius:3px;background:var(--accent-soft)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:1rem 1.25rem;padding-bottom:5.5rem;position:relative;z-index:1}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--nav-bg);border-top:var(--bw) solid var(--border);display:flex;z-index:200}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.48rem .15rem;background:none;border:none;cursor:pointer;color:var(--muted);transition:color .2s;font-family:var(--font-body);position:relative}
.nav-btn.active{color:var(--orange)}
.nav-btn.active::after{content:'';position:absolute;top:0;left:15%;right:15%;height:1px;background:var(--orange);box-shadow:0 0 8px var(--orange)}
.nav-ico{font-size:.95rem;line-height:1}
.nav-lbl{font-size:.44rem;letter-spacing:.1em;text-transform:uppercase}

/* SECTION TITLE */
.stitle{font-family:var(--font-head);font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--orange);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.6rem}
.stitle::before{content:'';display:inline-block;width:3px;height:12px;background:var(--orange);border-radius:2px;box-shadow:0 0 6px var(--orange);flex-shrink:0}

/* CARDS */
.card{background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.75rem}
.card-lbl{font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:.55rem}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:.28rem}
.chip{background:var(--chip-bg);border:1px solid var(--border);border-radius:5px;padding:.22rem .5rem;font-size:.76rem;font-weight:500;color:var(--cream)}
.chip.hot{background:var(--accent-soft);border-color:var(--orange2);color:var(--orange)}

/* BUTTONS */
.btn{font-family:var(--font-head);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;padding:.72rem 1.4rem;border:1px solid var(--orange);background:transparent;color:var(--orange);border-radius:var(--radius);cursor:pointer;transition:all .2s;width:100%;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.btn:hover::before{transform:scaleX(1)}
.btn span{position:relative;z-index:1;transition:color .25s}
.btn:hover span{color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}
.btn-sm{font-size:.52rem;padding:.38rem .75rem;width:auto;border-radius:5px}
.btn-ghost{border-color:var(--border);color:var(--muted)}
.btn-ghost::before{background:#28203e}
.btn-ghost:hover span{color:var(--cream)}
.btn-del{border-color:var(--red);color:#e04040}
.btn-del::before{background:var(--red)}
.btn-del:hover span{color:white}
.btn-green{border-color:var(--green);color:var(--green)}
.btn-green::before{background:var(--green)}
.btn-green:hover span{color:var(--bg)}

/* INPUTS */
.inp{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--cream);font-family:var(--font-body);font-size:.92rem;font-weight:500;padding:.43rem .68rem;width:100%;transition:border-color .2s;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--orange2)}
.inp-num{width:58px;text-align:center;font-family:var(--font-head);font-size:.82rem;padding:.38rem .15rem}

/* SCORE */
.stbl{width:100%;border-collapse:collapse;font-size:.78rem}
.stbl th{font-family:var(--font-head);font-size:.48rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:.45rem .18rem;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.stbl td{padding:.32rem .18rem;text-align:center;border-bottom:1px solid var(--row-line);vertical-align:middle}
.score-total{font-family:var(--font-head);font-size:.88rem;color:var(--orange);font-weight:700}
.win-badge{display:inline-block;background:var(--orange);color:var(--bg);font-family:var(--font-head);font-size:.42rem;letter-spacing:.1em;padding:.13rem .38rem;border-radius:3px;margin-top:2px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:.7rem .45rem;text-align:center;color:var(--card-text,var(--cream))}
.stat-num{font-family:var(--font-head);font-size:1.5rem;font-weight:700;color:var(--orange);line-height:1}
.stat-lbl{font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* HISTORY */
.rec{background:var(--card);border:var(--bw) solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius);padding:.78rem;margin-bottom:.6rem;transition:border-left-color .2s}
.rec:hover{border-left-color:var(--orange2)}

/* PROGRESS */
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:.38rem}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* AI */
.ai-dots{display:flex;gap:.4rem;justify-content:center;padding:2rem 0}
.ai-dot{width:8px;height:8px;background:var(--orange);border-radius:50%;animation:dotPulse 1.2s ease-in-out infinite}
.ai-dot:nth-child(2){animation-delay:.2s}
.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes dotPulse{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ai-text{font-size:.84rem;line-height:1.78;color:var(--cream);white-space:pre-wrap}

/* RANK CARD */
.rank-card{background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:.72rem 1rem;margin-bottom:.58rem;color:var(--card-text,var(--cream))}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;line-height:2}
.empty-ico{font-size:2.2rem;margin-bottom:.8rem;opacity:.25;display:block}

/* DIVIDER */
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}

/* ═══ MARS GLOBE ═══ */
.mars-globe{
  border-radius:50%;
  position:relative;
  background:
    radial-gradient(circle at 32% 27%, rgba(255,175,115,.48) 0%, transparent 36%),
    radial-gradient(ellipse 68% 24% at 56% 47%, rgba(45,5,0,.48) 0%, transparent 100%),
    radial-gradient(circle at 50% 48%, #d05030 0%, #9a2515 36%, #6a0e08 60%, #280402 100%);
  box-shadow:
    0 0 0 3px rgba(200,80,30,.2),
    0 0 50px rgba(232,104,42,.7),
    0 0 100px rgba(232,104,42,.3),
    0 0 180px rgba(232,104,42,.12),
    inset -28px -18px 55px rgba(0,0,0,.82),
    inset 6px 5px 18px rgba(210,110,70,.1);
  animation:marsFloat 7s ease-in-out infinite, marsGlow 4s ease-in-out infinite;
  overflow:hidden;
}
.mars-globe::before{
  content:'';position:absolute;
  top:3%;left:32%;width:36%;height:14%;
  background:radial-gradient(ellipse, rgba(255,248,238,.68), transparent 72%);
  border-radius:50%;filter:blur(3px);
}
.mars-globe::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:
    linear-gradient(-18deg, transparent 39%, rgba(35,5,0,.24) 41%, rgba(35,5,0,.12) 43%, transparent 45%),
    radial-gradient(ellipse 38% 16% at 46% 93%, rgba(255,248,238,.5), transparent 65%),
    radial-gradient(circle 9% at 24% 42%, rgba(220,165,105,.24), transparent);
}
@keyframes marsFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes marsGlow{
  0%,100%{box-shadow:0 0 0 3px rgba(200,80,30,.2),0 0 50px rgba(232,104,42,.7),0 0 100px rgba(232,104,42,.3),0 0 180px rgba(232,104,42,.12),inset -28px -18px 55px rgba(0,0,0,.82)}
  50%{box-shadow:0 0 0 3px rgba(200,80,30,.28),0 0 70px rgba(232,104,42,.9),0 0 140px rgba(232,104,42,.45),0 0 240px rgba(232,104,42,.18),inset -28px -18px 55px rgba(0,0,0,.82)}
}

/* ═══ DRAFT OVERLAY ═══ */
.draft-ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#030208 !important;display:flex;flex-direction:column;align-items:center;overflow:hidden;color:#e8d4c0}
.draft-stars{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;object-fit:cover}
.draft-topbar{position:relative;z-index:3;width:100%;max-width:500px;padding:.85rem 1.25rem 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.draft-prog{width:100%;max-width:500px;height:2px;background:var(--border);position:relative;z-index:3;flex-shrink:0}
.draft-prog-fill{height:100%;background:var(--orange);box-shadow:0 0 8px var(--orange);transition:width .6s ease}
.draft-planet{position:relative;z-index:3;width:100%;max-width:500px;display:flex;flex-direction:column;align-items:center;padding:1.1rem 0 .6rem;flex-shrink:0}
.draft-phase-lbl{font-family:var(--font-head);font-size:.65rem;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);text-shadow:0 0 18px var(--glow);margin-top:.7rem;animation:fadeUp .4s ease-out}
.draft-body{position:relative;z-index:3;flex:1;width:100%;max-width:500px;overflow-y:auto;padding:.25rem 1.25rem 0}
.draft-footer{position:relative;z-index:3;width:100%;max-width:500px;padding:.65rem 1.25rem 90px;flex-shrink:0;background:linear-gradient(0deg,var(--bg) 55%,transparent)}

/* ═══ SLOT MACHINE ═══ */
.slot-wrap{display:flex;align-items:center;justify-content:center;min-height:46px;margin:.3rem 0;border-radius:8px;padding:.5rem .9rem;font-family:var(--font-body);font-size:.92rem;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);letter-spacing:.04em;transition:all .3s;text-align:center}
.slot-spin{animation:slotFlicker .09s ease-in-out infinite;border-color:#382650}
.slot-locked{color:var(--cream);border-color:var(--orange2);background:linear-gradient(135deg,var(--accent-soft2),var(--accent-soft));box-shadow:0 0 14px rgba(232,104,42,.22);animation:lockFlash .45s ease-out forwards}
.slot-board{font-family:var(--font-head);font-size:1.9rem;font-weight:900;min-height:82px;color:var(--orange);text-shadow:0 0 35px var(--glow);border-color:var(--orange2);background:linear-gradient(135deg,var(--accent-soft2),var(--accent-soft))}
.slot-board.slot-spin{color:var(--muted);text-shadow:none;border-color:var(--border);background:var(--card)}
.slot-board.slot-locked{color:var(--orange);text-shadow:0 0 45px var(--glow),0 0 80px rgba(240,112,48,.4)}

@keyframes slotFlicker{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes lockFlash{0%{box-shadow:0 0 35px rgba(240,112,48,.9);border-color:var(--orange)}100%{box-shadow:0 0 14px rgba(240,112,48,.22);border-color:var(--orange2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* player badge in draft */
.p-badge{display:flex;align-items:center;gap:.55rem;margin-bottom:.55rem;padding:.45rem .7rem;border-radius:7px;background:var(--card);border:1px solid var(--border)}
.p-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.p-badge-name{font-family:var(--font-head);font-size:.65rem;letter-spacing:.14em;font-weight:700}

/* ═══ SUMMARY (in draft modal) ═══ */
.sum-board{text-align:center;padding:.9rem;border:1px solid var(--orange2);border-radius:8px;background:linear-gradient(135deg,var(--accent-soft2),var(--accent-soft));margin-bottom:.65rem}
.sum-board-name{font-family:var(--font-head);font-size:1.5rem;font-weight:900;color:var(--orange);text-shadow:0 0 35px var(--glow)}

/* ═══ SETTINGS ═══ */
.set-item{display:flex;align-items:center;gap:.45rem;padding:.3rem 0;border-bottom:1px solid var(--row-line)}
.set-item-name{flex:1;font-size:.84rem;color:var(--cream)}
.color-pick{display:flex;gap:.38rem;flex-wrap:wrap;margin-top:.42rem}
.color-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;padding:0}
.color-btn.sel{border-color:white;transform:scale(1.18)}
.color-btn:hover{transform:scale(1.12)}

/* ═══ DRAFT ENTRY VIEW ═══ */
.entry-hero{text-align:center;padding:1.5rem 1rem;border:1px solid var(--orange2);border-radius:12px;background:linear-gradient(135deg,var(--accent-soft2),var(--accent-soft));margin-bottom:1rem;position:relative;overflow:hidden;cursor:pointer;transition:all .3s}
.entry-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(240,112,48,.12),transparent 65%)}
.entry-hero:hover{border-color:var(--orange);box-shadow:0 0 30px rgba(240,112,48,.15)}

/* ═══ TIMER ═══ */
.timer-ring-wrap{position:relative;width:200px;height:200px;margin:0 auto 1.2rem;flex-shrink:0}
.timer-ring-bg{fill:none;stroke:#1a1530;stroke-width:7}
.timer-ring-fg{fill:none;stroke:var(--orange);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .4s}
.timer-clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-family:var(--font-head);font-size:2.35rem;font-weight:900;color:var(--orange);text-shadow:0 0 28px var(--glow);letter-spacing:.04em;line-height:1}
.timer-status{font-family:var(--font-head);font-size:.45rem;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-top:.3rem}
.timer-btns{display:flex;gap:.55rem;justify-content:center;margin-bottom:1rem}

/* ═══ FIRST PLAYER OVERLAY ═══ */
.fp-ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#020107;display:flex;flex-direction:column;align-items:center;justify-content:space-between;max-width:500px;left:50%;transform:translateX(-50%);overflow:hidden;padding-bottom:1.8rem}
.fp-topbar{width:100%;padding:.85rem 1.25rem 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:3;flex-shrink:0}
.fp-canvas-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
@keyframes winnerReveal{from{opacity:0;transform:scale(.4) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}
.fp-winner-name{font-family:var(--font-head);font-size:1.55rem;font-weight:900;color:var(--orange);text-shadow:0 0 40px var(--glow),0 0 80px rgba(240,112,48,.45);letter-spacing:.05em;text-align:center;animation:winnerReveal .55s cubic-bezier(.34,1.56,.64,1) both}
.fp-winner-sub{font-family:var(--font-head);font-size:.52rem;letter-spacing:.42em;color:var(--cream);text-transform:uppercase;text-align:center;margin-bottom:.35rem;animation:winnerReveal .55s .1s cubic-bezier(.34,1.56,.64,1) both}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.particle{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:particleFly .9s ease-out forwards}
[data-theme="light"]{--bg:#f5f0e8;--surface:#ede8e0;--card:#fff;--border:#d0c4b4;--orange:#c04818;--orange2:#9c3610;--red:#991818;--cream:#18100a;--muted:#887060;--green:#286840;--glow:rgba(192,72,24,.15)}
[data-theme="light"] body,[data-theme="light"] #root{background:#f5f0e8;color:#18100a}
[data-theme="light"] .app{background:#f5f0e8}
[data-theme="light"] .hdr{background:linear-gradient(180deg,#f5f0e8,transparent);border-bottom-color:#d0c4b4}
[data-theme="light"] .logo{text-shadow:none}
[data-theme="light"] .hdr-badge{background:#fde8dc;color:#c04818;border-color:#c04818}
[data-theme="light"] .nav{background:#ede8e0;border-top-color:#d0c4b4}
[data-theme="light"] .nav-btn.active::after{box-shadow:none}
[data-theme="light"] .card{background:#fff;border-color:#d0c4b4}
[data-theme="light"] .chip{background:#ede8e0;border-color:#d0c4b4;color:#18100a}
[data-theme="light"] .chip.hot{background:#fde8dc;border-color:#c04818;color:#9c3610}
[data-theme="light"] .inp{background:#ede8e0;border-color:#d0c4b4;color:#18100a}
[data-theme="light"] .inp:focus{border-color:#c04818}
[data-theme="light"] .btn{border-color:#c04818;color:#c04818}
[data-theme="light"] .btn::before{background:#c04818}
[data-theme="light"] .btn:hover span{color:#fff}
[data-theme="light"] .btn-ghost{border-color:#d0c4b4;color:#887060}
[data-theme="light"] .btn-ghost::before{background:#d0c4b4}
[data-theme="light"] .btn-ghost:hover span{color:#18100a}
[data-theme="light"] .btn-del{border-color:#991818;color:#cc2020}
[data-theme="light"] .btn-del::before{background:#991818}
[data-theme="light"] .btn-green{border-color:#286840;color:#286840}
[data-theme="light"] .btn-green::before{background:#286840}
[data-theme="light"] .btn-green:hover span{color:#fff}
[data-theme="light"] .stitle{border-bottom-color:#d0c4b4}
[data-theme="light"] .stbl th{border-bottom-color:#d0c4b4;color:#887060}
[data-theme="light"] .stbl td{border-bottom-color:#e8e0d4}
[data-theme="light"] .score-total{color:#c04818}
[data-theme="light"] .win-badge{background:#c04818;color:#fff}
[data-theme="light"] .rec,[data-theme="light"] .rank-card,[data-theme="light"] .stat-card{background:var(--card);border-color:#d0c4b4}
[data-theme="light"] .stat-num{color:#c04818}
[data-theme="light"] .prog-bar{background:#d0c4b4}
[data-theme="light"] .ai-text{color:#18100a}
[data-theme="light"] .ai-dot{background:#c04818}
[data-theme="light"] .set-item{border-bottom-color:#e8e0d4}
[data-theme="light"] .set-item-name{color:#18100a}
[data-theme="light"] .slot-wrap{background:#fff;border-color:#d0c4b4;color:#887060}

/* Extra light theme fixes for player name visibility */

/* Fix InlineLottery text in light mode */

.conf-ans-btn { transition: all .15s !important; }
.conf-ans-btn:hover:not(.conf-no-comment) { background: var(--border) !important; border-color: var(--orange2) !important; color: var(--cream) !important; }
.conf-ans-btn:active { opacity: .85; }

/* Player selection buttons — always readable */
.player-sel-btn {
  display: flex; align-items: center; gap: .32rem;
  border-radius: 7px; padding: .38rem .7rem;
  cursor: pointer; transition: all .18s;
  border: 2px solid var(--border);
  background: transparent;
}
.player-sel-btn.selected { border-color: var(--btn-color, var(--orange)); }
.player-sel-btn .btn-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: all .18s;
}
.player-sel-btn.selected .btn-dot { background: var(--btn-color, var(--orange)); }
.player-sel-btn .btn-name {
  font-size: .85rem; font-weight: 500; color: var(--cream);
}
.player-sel-btn.selected .btn-name {
  font-weight: 700; color: var(--btn-color, var(--orange));
}
[data-theme="light"] .player-sel-btn { background: rgba(200,180,160,.08); }

/* Draft modal always dark */
.draft-ov, .draft-ov * { color: inherit; }
.draft-phase-lbl { color: #f07030 !important; }
.draft-topbar { color: #888 !important; }

/* ═══════════════════════════════════════════
   SKÓRKI — wygląd aplikacji wybierany w Ustawieniach.
   Każda nadpisuje tylko tokeny; układ ekranów zostaje wspólny.
   ═══════════════════════════════════════════ */

/* 01 · TERMINAL POKŁADOWY */
[data-skin="terminal"]{--bg:#04070a;--surface:#071a0f;--card:#060f0a;--border:#16402c;--orange:#5be39a;--orange2:#2f7a52;--red:#c05a3a;--cream:#c8f5dc;--muted:#3f8f66;--green:#5be39a;--glow:rgba(91,227,154,.3);--font-head:'IBM Plex Mono',monospace;--font-body:'IBM Plex Mono',monospace;--radius:0px;--bw:1px;--hdr-bg:#04070a;--nav-bg:#061009;--chip-bg:#0a1a12;--row-line:#0e2b1d;--accent-soft:#0a1a12;--accent-soft2:#071a0f}

[data-skin="terminal"] .app::before{background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.22) 1px,transparent 1px,transparent 3px)}

[data-skin="karta"]{--bg:#e0d5bd;--surface:#ebe1cb;--card:#f4eddd;--card-text:#241e16;--border:#c2b091;--orange:#7a4e15;--orange2:#5d3a0f;--red:#8a2a18;--cream:#241e16;--muted:#63543f;--green:#275a3a;--glow:rgba(122,78,21,.15);--font-head:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;--radius:10px;--bw:2px;--hdr-bg:#ebe1cb;--nav-bg:#ebe1cb;--chip-bg:#ebe1cb;--row-line:#d8cbb0;--accent-soft:#f6ead6;--accent-soft2:#efe4ce}

/* ── 03 · KARTA PROJEKTU — układ ──────────────────
   Papierowe karty na jasnym lnianym stole. Jedna powierzchnia = jedna paleta,
   więc tekst nigdzie nie musi zmieniać jasności i kontrast wychodzi sam. */
[data-skin="karta"] body,
[data-skin="karta"] #root,
[data-skin="karta"] .app { background: #e0d5bd }

/* karta z kolorowym paskiem typu, jak karta projektu w grze */
[data-skin="karta"] .card { padding-top: 0; overflow: hidden; border-color: #241e16 }
[data-skin="karta"] .card > .card-lbl:first-child {
  margin: 0 -1rem .8rem;
  padding: .45rem 1rem;
  background: #275a3a;
  /* !important, bo etykiety mają w JS inline `color: var(--orange)` */
  color: #ffffff !important;
  font-family: var(--font-head);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .18em;
}

[data-skin="karta"] .hdr { background: #ebe1cb; border-bottom: 2px solid #241e16 }
[data-skin="karta"] .logo { font-size: 1rem; letter-spacing: .08em; color: #241e16 }
[data-skin="karta"] .logo-sub { color: #63543f }
[data-skin="karta"] .hdr-badge { background: #241e16; color: #f4eddd; border-color: #241e16 }

[data-skin="karta"] .stitle { color: #241e16; border-bottom-color: #c2b091; font-size: .72rem }
[data-skin="karta"] .stitle::before { background: #7a4e15; box-shadow: none }

/* nawigacja jako rząd zakładek */
[data-skin="karta"] .nav { background: #ebe1cb; border-top: 2px solid #241e16; gap: 4px; padding: .5rem .7rem .75rem }
[data-skin="karta"] .nav-btn { border-radius: 7px; background: #dccfb2; color: #4a3d2c; padding: .42rem .1rem .45rem; gap: 1px }
[data-skin="karta"] .nav-btn.active { background: #241e16; color: #f4eddd }
[data-skin="karta"] .nav-btn.active::after { display: none }
[data-skin="karta"] .nav-lbl { font-size: .46rem; font-weight: 600 }

/* przyciski: pełne, z ciemną ramką — jak akcja na karcie */
[data-skin="karta"] .btn { background: #7a4e15; border: 2px solid #241e16; color: #fff6e4; font-size: .7rem }
[data-skin="karta"] .btn::before { display: none }
[data-skin="karta"] .btn span { color: #fff6e4 }
[data-skin="karta"] .btn-ghost { background: transparent; border-color: #63543f }
[data-skin="karta"] .btn-ghost span { color: #4a3d2c }
[data-skin="karta"] .btn-del { background: #8a2a18; border-color: #241e16 }
[data-skin="karta"] .btn-del span { color: #fff0ec }
[data-skin="karta"] .btn-green { background: #275a3a; border-color: #241e16 }
[data-skin="karta"] .btn-green span { color: #ffffff }

[data-skin="karta"] .entry-hero { background: #f4eddd; border: 2px solid #241e16 }
[data-skin="karta"] .entry-hero::before { background: none }
[data-skin="karta"] .win-badge { background: #275a3a; color: #ffffff }

/* ── 01 · TERMINAL — układ ────────────────────────
   Nawigacja jako klawisze funkcyjne, nagłówki jako prompt powłoki. */
[data-skin="terminal"] .nav { padding: 0 }
[data-skin="terminal"] .nav-btn { flex-direction: row; gap: .35em; padding: .8rem .1rem; font-size: 10px }
[data-skin="terminal"] .nav-ico { display: none }
[data-skin="terminal"] .nav-lbl { font-size: 10px; letter-spacing: .02em; text-transform: uppercase }
[data-skin="terminal"] .nav-btn::before { font-size: 10px; opacity: .75 }
[data-skin="terminal"] .nav-btn:nth-child(1)::before { content: "F1" }
[data-skin="terminal"] .nav-btn:nth-child(2)::before { content: "F2" }
[data-skin="terminal"] .nav-btn:nth-child(3)::before { content: "F3" }
[data-skin="terminal"] .nav-btn:nth-child(4)::before { content: "F4" }
[data-skin="terminal"] .nav-btn:nth-child(5)::before { content: "F5" }
[data-skin="terminal"] .nav-btn:nth-child(6)::before { content: "F6" }
[data-skin="terminal"] .nav-btn.active { background: var(--orange); color: var(--bg) }
[data-skin="terminal"] .nav-btn.active::after { display: none }
[data-skin="terminal"] .stitle::before { display: none }
[data-skin="terminal"] .stitle { color: #9cf5c4; letter-spacing: .14em }
[data-skin="terminal"] .stitle::after { content: ""; flex: 1; height: 1px; background: var(--border) }
[data-skin="terminal"] .btn span::before { content: "[ " }
[data-skin="terminal"] .btn span::after { content: " ]" }
[data-skin="terminal"] .card-lbl::before { content: "> " }
[data-skin="terminal"] .logo { text-transform: none }

/* ── 02 · BRUTALIZM — układ ───────────────────────
   Karty znikają, zostają pasy na pełną szerokość oddzielone grubą linią. */
[data-skin="brutal"] .card {
  margin: 0 -1.25rem .75rem;
  padding: 1rem 1.25rem;
  border-left: 0;
  border-right: 0;
  border-radius: 0;
}
[data-skin="brutal"] .card-lbl { font-size: .62rem; font-weight: 900; letter-spacing: .2em }
[data-skin="brutal"] .stitle { font-size: 1.5rem; font-weight: 900; letter-spacing: -.03em; border-bottom-width: 5px; padding-bottom: .3rem }
[data-skin="brutal"] .stitle::before { display: none }
[data-skin="brutal"] .rec, [data-skin="brutal"] .stat-card, [data-skin="brutal"] .rank-card { border-radius: 0 }
[data-skin="brutal"] .nav-btn.active::after { display: none }
[data-skin="brutal"] .nav-btn.active { background: var(--orange); color: #ffffff }

/* ── 06 · RYSUNEK TECHNICZNY — układ ──────────────
   Treść w ramce rysunku, nawigacja jako tabelka rysunkowa. */
[data-skin="rysunek"] .content { border: 1px solid var(--border); margin: .5rem .5rem 0; padding: .9rem 1rem 5.5rem }
[data-skin="rysunek"] .card { border-radius: 0 }
[data-skin="rysunek"] .card-lbl { font-family: var(--font-head); font-size: .58rem; letter-spacing: .14em }
[data-skin="rysunek"] .stitle { letter-spacing: .14em }
[data-skin="rysunek"] .nav { padding: 0; border-top-width: 1px }
[data-skin="rysunek"] .nav-btn { border-left: 1px solid var(--border); padding: .7rem .1rem; gap: 3px }
[data-skin="rysunek"] .nav-btn:first-child { border-left: 0 }
[data-skin="rysunek"] .nav-ico { font-size: .8rem }
[data-skin="rysunek"] .nav-btn.active { background: var(--orange); color: var(--bg) }
[data-skin="rysunek"] .nav-btn.active::after { display: none }

/* ── 08 · DZIENNIK MISJI — układ ──────────────────
   Czerwony margines z lewej, wpisy zamiast kart, spis treści w stopce. */
[data-skin="dziennik"] .app::before {
  background: linear-gradient(to right,
    transparent 33px, rgba(164,50,30,.28) 33px, rgba(164,50,30,.28) 34px, transparent 34px);
}
[data-skin="dziennik"] .content { padding-left: 46px }
[data-skin="dziennik"] .hdr { padding-left: 46px; border-bottom-width: 1px; border-bottom-color: var(--cream) }
[data-skin="dziennik"] .card {
  border: 0;
  border-top: 1px solid var(--border);
  border-radius: 0;
  background: transparent;
  padding: .8rem 0 .2rem;
}
[data-skin="dziennik"] .card-lbl { letter-spacing: .24em; font-size: .6rem }
[data-skin="dziennik"] .stitle { font-weight: 600; letter-spacing: .2em }
[data-skin="dziennik"] .nav {
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 2px 16px;
  padding: .7rem 1.25rem .9rem 46px;
  border-top-color: var(--cream);
}
[data-skin="dziennik"] .nav-btn { flex: 0 0 auto; flex-direction: row; padding: .2rem 0 }
[data-skin="dziennik"] .nav-ico { display: none }
[data-skin="dziennik"] .nav-lbl { font-size: 12px; letter-spacing: .1em }
[data-skin="dziennik"] .nav-btn.active { font-weight: 700 }
[data-skin="dziennik"] .nav-btn.active::after { left: 0; right: 0; top: auto; bottom: 0; height: 2px; box-shadow: none }
[data-skin="terminal"] .btn span { white-space: nowrap }
/* wąskie ekrany: margines dziennika nie może wypychać plakietki poza kadr */
[data-skin="dziennik"] .hdr { padding-left: 40px; gap: .5rem }
[data-skin="dziennik"] .hdr > div:first-child { min-width: 0 }
[data-skin="dziennik"] .logo { font-size: .82rem }
/* Brutalizm: pomarańcz służy do wypełnień, nie do pisania — na bieli daje 3,57.
   Tekst akcentowany jest czarny, co i tak jest bliżej brutalistycznego pierwowzoru. */
[data-skin="brutal"] .card-lbl,
[data-skin="brutal"] .stat-num,
[data-skin="brutal"] .score-total,
[data-skin="brutal"] .stitle { color: #000000 !important }
[data-skin="brutal"] .entry-hero, [data-skin="brutal"] .entry-hero * { color: #000000 !important }
</style></head>

<script>// Rejestracja service workera + pasek „jest nowa wersja". Wklejane do template.html przez build.mjs.
(function () {

  var secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!secure) return; // plik otwarty prosto z dysku — bez SW

  function showBar(onAccept) {
    if (document.getElementById('tfm-update')) return;
    var bar = document.createElement('div');
    bar.id = 'tfm-update';
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:4.6rem;z-index:9999;' +
      'width:calc(100% - 2rem);max-width:468px;display:flex;align-items:center;gap:.6rem;padding:.7rem .85rem;' +
      'border:1px solid var(--orange,#f07030);border-radius:10px;background:var(--surface,#0d0b13);' +
      'color:var(--cream,#e8d8c0);font-family:var(--font-body,sans-serif);font-size:.82rem;' +
      'box-shadow:0 8px 24px rgba(0,0,0,.45)';

    var txt = document.createElement('span');
    txt.style.cssText = 'flex:1;line-height:1.35';
    txt.textContent = 'Jest nowa wersja aplikacji.';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Odśwież';
    btn.style.cssText = 'flex-shrink:0;border:1px solid var(--orange,#f07030);border-radius:7px;' +
      'background:var(--orange,#f07030);color:#150c08;font-family:var(--font-head,sans-serif);' +
      'font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:.5rem .8rem;cursor:pointer';
    btn.addEventListener('click', function () {
      btn.disabled = true;
      btn.textContent = '…';
      onAccept();
    });

    var later = document.createElement('button');
    later.type = 'button';
    later.setAttribute('aria-label', 'Odłóż aktualizację');
    later.textContent = '×';
    later.style.cssText = 'flex-shrink:0;border:none;background:none;color:var(--muted,#685870);' +
      'font-size:1.15rem;line-height:1;cursor:pointer;padding:.2rem .35rem';
    later.addEventListener('click', function () { bar.remove(); });

    bar.appendChild(txt);
    bar.appendChild(btn);
    bar.appendChild(later);
    document.body.appendChild(bar);
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function (reg) {

})();
</script>
